spring.application.name=zerowaste

# ── PostgreSQL ──
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zerowaste}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── JWT ──
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ── CORS ──
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# ── Mail (Gmail SMTP) ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Without these, JavaMail has NO deadline at all — if Gmail's SMTP is evers
# slow or briefly unreachable, a send can hang far longer than these
# millisecond values below (worst case: minutes), tying up whatever thread
# is running it. Now that sending is @Async (see AsyncConfig), that thread
# is a background worker rather than the request thread, but it still needs
# a hard ceiling so a stuck send can't eventually exhaust the worker pool.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME:}
# app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.frontend.base-url=${APP_FRONTEND_URL:http://localhost:5173}
# ── 2FA OTP ──
app.2fa.otp-expiry-minutes=10

# ── Expiry Alerts ──
# Notifications are generated only when food has 3 or fewer days remaining.
app.expiry-alerts.days-before=3

# Run the expiry notification check every day at 6:00 AM.
app.expiry-alerts.cron=0 0 6 * * *

# Local overrides (gitignored)
spring.config.import=optional:classpath:application-local.properties

#Server port (default to 8080 if not set)
server.port=${PORT:8080}

# --Meal Plan Reminders--
app.meal-reminders.cron=0 0 18 * * *